name: test
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,conversion]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest --cov=paperhub --cov-report=xml --cov-fail-under=70
      - run: python -m build

