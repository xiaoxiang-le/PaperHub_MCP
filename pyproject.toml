[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "paperhub-mcp"
version = "0.1.0"
description = "Local-first paper library, conversion, translation and outlines over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2", "pydantic>=2.10,<3", "httpx>=0.28,<1",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "packaging>=24",
  "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "openai>=1.68,<3", "anthropic>=0.49,<1",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
conversion = ["pypandoc-binary>=1.14,<2"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "pytest-cov>=6", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[project.scripts]
paperhub-mcp = "paperhub.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/paperhub"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

